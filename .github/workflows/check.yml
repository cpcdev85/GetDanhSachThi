name: KMA Schedule Auto

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: xem thử; upload: nhập lên web ngay; auto: theo biến KMA_ENABLE_UPLOAD'
        required: true
        default: preview
        type: choice
        options:
          - preview
          - upload
          - auto

permissions:
  contents: write

concurrency:
  group: kma-schedule-upload
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check PDFs and upload new JSON
        env:
          KMA_ADMIN_BASE_URL: ${{ secrets.KMA_ADMIN_BASE_URL }}
          KMA_ADMIN_USERNAME: ${{ secrets.KMA_ADMIN_USERNAME }}
          KMA_ADMIN_PASSWORD: ${{ secrets.KMA_ADMIN_PASSWORD }}
          GH_STATE_TOKEN: ${{ github.token }}
          KMA_MODE: ${{ inputs.mode || 'auto' }}
          KMA_ENABLE_UPLOAD: ${{ vars.KMA_ENABLE_UPLOAD || 'false' }}
        run: python -u kmaschedule_actions.py
